<style>/* EndoControl — bright, friendly theme (cards & KPI tiles inspired by dashboard tools such as Shaper) */
:root{
  --bg:#f4f3f0;--bg2:#efeeea;--card:#fbfaf8;--text:#22223a;--muted:#6f6f86;--line:#e6e4df;
  --accent:#5b5fe0;--accent2:#d6559a;--accent-soft:#ebebfc;
  --grad:linear-gradient(135deg,#5b5fe0 0%,#7f7cf0 55%,#4cb8d6 100%);
  --in:#4fb37f;--in-soft:#e2f3e9;--low:#de4f8a;--vlow:#b0306a;--high:#e9a23b;--vhigh:#e57a3a;
  --carb:#e9a23b;--ins:#6366f1;
  --shadow:0 6px 22px rgba(40,40,70,.06),0 1px 2px rgba(40,40,70,.05);
  --radius:22px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14141c;--bg2:#1d1d28;--card:#1f1f2b;--text:#eeeef6;--muted:#a0a0b8;--line:#2e2e3e;
    --accent:#8f92f5;--accent2:#ec7fb3;--accent-soft:#2a2a48;--in-soft:#173a29;
    --shadow:0 8px 28px rgba(0,0,0,.35)}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic","Noto Sans Devanagari","Noto Sans CJK SC",Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;padding-bottom:calc(96px + env(safe-area-inset-bottom));
  background-image:radial-gradient(900px 500px at 100% -10%,rgba(76,184,214,.08),transparent 60%),radial-gradient(800px 500px at -10% 0%,rgba(91,95,224,.08),transparent 60%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}

/* ---------- top bar (glass) ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top));
  background:color-mix(in srgb,var(--card) 72%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--text);font-size:19px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.logo img{border-radius:9px;box-shadow:0 4px 12px rgba(91,95,224,.35)}
.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mainnav{display:flex;gap:4px;margin-inline-start:10px}
.mainnav a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;transition:.15s}
.mainnav a:hover{color:var(--text);background:var(--bg2)}
.mainnav a.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(91,95,224,.25)}
.topright{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
#langSel{width:auto;padding:7px 10px;border-radius:999px;background:var(--card)}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}

/* ---------- floating bottom nav (phones) ---------- */
.bottomnav{display:none}
@media (max-width:820px){
  .mainnav{display:none}
  .bottomnav{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;padding:6px;border-radius:26px;
    background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);
    box-shadow:0 12px 32px rgba(40,40,70,.18);border:1px solid var(--line)}
  .bottomnav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;padding:7px 0 6px;border-radius:20px;transition:.15s}
  .bottomnav a span{display:block;font-size:21px;line-height:1.2}
  .bottomnav a.on{background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(91,95,224,.3)}
  .logo span{display:none}
}

main{max-width:1100px;margin:0 auto;padding:18px}
@media (max-width:820px){main{padding:12px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font-size:17px;font-weight:750;letter-spacing:-.01em}
h1{font-size:26px;margin:6px 0 16px;font-weight:800;letter-spacing:-.025em}
h3{font-size:12px;margin:16px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media screen and (max-width:820px){.g4{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}}

/* ---------- forms & buttons ---------- */
input,select,textarea{font:inherit;color:var(--text);background:var(--bg2);border:1.5px solid transparent;border-radius:14px;padding:11px 13px;width:100%;transition:.15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 4px var(--accent-soft)}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 5px}
.fld{margin-bottom:13px}
.btn{font:inherit;font-weight:700;border:0;background:var(--grad);color:#fff;padding:12px 20px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center;
  box-shadow:0 8px 20px rgba(91,95,224,.25);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(91,95,224,.32)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn.red{background:#ffe4e6;color:#be123c;box-shadow:none}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.block{display:block;width:100%}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.err{color:var(--low);font-size:13px;min-height:18px;margin:4px 0}
.ok{color:var(--in)}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--text);margin:10px 0;font-weight:400}
.check input{width:auto;margin-top:3px;accent-color:var(--accent)}
.seg{display:inline-flex;background:var(--bg2);border-radius:999px;padding:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 13px;border-radius:999px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(40,40,70,.15)}
.loading{padding:50px;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(10px);background:#1c1633;color:#fff;padding:11px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- sign in / register ---------- */
.auth{max-width:440px;margin:22px auto}
.auth .hero{text-align:center;margin-bottom:18px}
.auth .hero img{width:76px;height:76px;border-radius:22px;box-shadow:0 14px 34px rgba(91,95,224,.4)}
.auth .hero h1{margin:14px 0 6px;font-size:30px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.roles button{border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:18px;padding:14px 8px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
.roles button span{display:block;font-size:28px;margin-bottom:4px}
.roles button.on{border-color:transparent;background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(91,95,224,.28)}
.pwbar{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.pwbar i{display:block;height:100%;width:0;transition:.2s;border-radius:3px}

/* ---------- current glucose hero card ---------- */
.hero-card{border-radius:28px;padding:22px 22px 20px;margin-bottom:14px;color:#fff;background:var(--grad);box-shadow:0 16px 36px rgba(91,95,224,.28);position:relative;overflow:hidden}
.hero-card::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero-card.st-in{background:linear-gradient(135deg,#4fb37f,#3fa6a0);box-shadow:0 16px 36px rgba(79,179,127,.28)}
.hero-card.st-high{background:linear-gradient(135deg,#e9a23b,#e57a3a);box-shadow:0 16px 36px rgba(233,162,59,.28)}
.hero-card.st-vhigh{background:linear-gradient(135deg,#e57a3a,#d6559a);box-shadow:0 16px 36px rgba(229,122,58,.3)}
.hero-card.st-low{background:linear-gradient(135deg,#e468a0,#de4f8a);box-shadow:0 16px 36px rgba(222,79,138,.3)}
.hero-card.st-vlow{background:linear-gradient(135deg,#c2407a,#8e2457);box-shadow:0 16px 36px rgba(176,48,106,.34)}
.now{display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:relative;z-index:1}
.now .val{font-size:64px;font-weight:850;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.now .arrow{font-size:40px;font-weight:700;margin-inline-start:8px;opacity:.95}
.now .unit{font-size:14px;opacity:.9;margin-top:4px}
.now .who{font-weight:750;font-size:19px}
.now .meta{opacity:.9;font-size:14px}
.hero-card .seg{background:rgba(255,255,255,.2)}
.hero-card .seg button{color:rgba(255,255,255,.9)}
.hero-card .seg button.on{background:#fff;color:#1c1633}
.chartcard{padding:14px 14px 10px}

/* ---------- KPI tiles ---------- */
.metric{background:var(--bg2);border-radius:18px;padding:13px 14px;position:relative;overflow:hidden}
.metric::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad)}
.metric .l{font-size:12px;font-weight:600;color:var(--muted)}
.metric .v{font-size:26px;font-weight:800;margin-top:2px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.metric .t{font-size:11.5px;color:var(--muted)}

/* ---------- quick actions ---------- */
.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:820px){.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 8px;margin:0 -2px}.quick::-webkit-scrollbar{display:none}.quick button{flex:0 0 auto;min-width:84px;padding:10px 8px;font-size:11.5px;white-space:nowrap}}
.quick button{border:0;background:var(--card);color:var(--text);border-radius:20px;padding:12px 4px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
.quick button:hover{transform:translateY(-2px)}
.quick button span{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 6px;border-radius:14px;font-size:22px}
.quick button:nth-child(1) span{background:#fbefdc}
.quick button:nth-child(2) span{background:#e6e7fb}
.quick button:nth-child(3) span{background:#fbe3ee}
.quick button:nth-child(4) span{background:#e2f3e9}
.quick button:nth-child(5) span{background:#def2f7}
@media (prefers-color-scheme:dark){.quick button span{background:var(--bg2)!important}}

.cta{background:var(--grad);color:#fff;border-radius:28px;padding:24px;margin-bottom:14px;box-shadow:0 16px 36px rgba(91,95,224,.3)}
.cta h2{margin:0 0 6px;color:#fff;font-size:21px}
.cta .btn{background:#fff;color:var(--accent2);box-shadow:none}
.status{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.status:last-child{border-bottom:0}
.dot{width:11px;height:11px;border-radius:50%;margin-top:6px;flex:none}
.dot.ok{background:var(--in);box-shadow:0 0 0 4px var(--in-soft)}.dot.err{background:var(--low);box-shadow:0 0 0 4px #ffe4e6}.dot.wait{background:var(--high);box-shadow:0 0 0 4px #fef3c7}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
@media screen and (max-width:820px){ svg text{font-size:19px} }
.legend{font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px;vertical-align:-1px}

/* ---------- time in ranges ---------- */
.tir{display:flex;gap:16px;align-items:center}
.tirbar{display:flex;flex-direction:column;height:180px;width:42px;border-radius:12px;overflow:hidden;flex:none}
.tirleg{flex:1}
.tirleg div{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.tirleg i{width:12px;height:12px;border-radius:4px;flex:none}
.tirleg b{margin-inline-start:auto}

/* ---------- connect a sensor ---------- */
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.brand{border:1px solid var(--line);background:var(--card);border-radius:22px;padding:16px;cursor:pointer;text-align:start;font:inherit;color:var(--text);box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.brand:hover,.brand.on{transform:translateY(-3px);box-shadow:0 14px 30px rgba(91,95,224,.18);border-color:transparent}
.brand{display:grid;grid-template-columns:48px 1fr;column-gap:14px;align-items:center}
.brand .ic{grid-row:span 2;display:grid;place-items:center;width:48px;height:48px;border-radius:16px;font-size:26px;background:var(--accent-soft)}
.brand b{display:block;margin:0 0 2px;font-size:16px;align-self:end}
.brand .small{align-self:start}
.method{border:1px solid var(--line);background:var(--card);border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.method .tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--grad);color:#fff;margin-inline-start:8px;vertical-align:2px}
ol.steps{padding-inline-start:20px;margin:8px 0}
ol.steps li{margin:5px 0}
ol.steps li::marker{color:var(--accent);font-weight:800}
.copy{display:flex;gap:6px;align-items:center;margin:6px 0}
.copy code{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--bg2);padding:9px 12px;border-radius:12px;overflow-x:auto;white-space:nowrap}

/* ---------- lists ---------- */
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.pitem{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:20px;margin-bottom:10px;cursor:pointer;background:var(--card);text-decoration:none;color:var(--text);box-shadow:var(--shadow);transition:transform .12s}
.pitem:hover{transform:translateY(-2px)}
.avatar{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--grad);flex:none}
.flag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;font-weight:700;margin-inline-end:4px}
.flag.red{background:#ffe4e6;color:#be123c}.flag.amb{background:#fef3c7;color:#92400e}.flag.ok{background:var(--in-soft);color:#047857}.flag.blue{background:var(--accent-soft);color:var(--accent)}
.note{padding:12px 14px;border-radius:16px;background:var(--bg2);margin-bottom:9px;border-inline-start:4px solid var(--accent)}
.note.doc{border-inline-start-color:var(--in)}
.note .meta{font-size:12px;color:var(--muted);margin-bottom:3px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.daycard{border:1px solid var(--line);border-radius:18px;padding:10px 12px;background:var(--card);break-inside:avoid}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(28,22,51,.45);backdrop-filter:blur(4px);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:821px){.modal{align-items:center}}
.modal .card{width:100%;max-width:480px;max-height:90vh;overflow:auto;margin:0;border-radius:28px 28px 0 0}
@media (min-width:821px){.modal .card{border-radius:28px}}

/* ---------- print / PDF report ---------- */
.print-only{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;background-image:none;color:#000;padding:0;font-size:11px}
  .top,.bottomnav,.no-print,#toast{display:none!important}
  main{max-width:none;padding:0}
  .card,.method{border:0;padding:0;margin:0 0 8px;box-shadow:none}
  .hero-card{background:#fff!important;color:#000;box-shadow:none;padding:0}
  .metric::before{display:none}
  .print-only{display:block}
  .days{grid-template-columns:1fr 1fr}
  .daycard{page-break-inside:avoid}
  .card{break-inside:avoid}
  .card.allowbreak{break-inside:auto}
  h2{break-after:avoid}
  :root{--bg:#fff;--bg2:#f4f4f6;--card:#fff;--text:#000;--muted:#555;--line:#ddd;--in-soft:#e2f3e9}
}

/* ---------- AI analyst ---------- */
.ins{background:var(--accent-soft);border-radius:14px;padding:10px 13px;margin:8px 0;font-size:14px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:min(60vh,520px);overflow-y:auto;margin:6px 0}
.chat:empty{display:none}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--bg2);border-bottom-left-radius:6px}
.msg.pending{color:var(--muted);font-style:italic}
.msg p{margin:4px 0}.msg ul,.msg ol{margin:4px 0;padding-inline-start:20px}.msg li{margin:2px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 12px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.aiform{display:flex;gap:8px;margin-top:10px}
.aiform input{flex:1;min-width:0}
.aiform .btn{padding:10px 18px}
</style>
</head>

  /timestamp|zeitstempel|marca de tiempo|horodatage|метка времени|datetime|date ?time|дата и время|日時|일시/i];

      let v = u.base + 25 * Math.exp(-((h - 6.5) ** 2) / 3);
      for (const [mh, , c] of meals) { const dt = (h - mh) * 60; if (dt > 0) { const x = dt / 65; v += c * u.sens * x * Math.exp(1 - x); } }
      if (hypo) v -= 80 * Math.exp(-((h - 2.8) ** 2) / 1.1);
      if (act) v -= 40 * Math.exp(-((h - act - 0.7) ** 2) / 0.8);
      ar = ar * 0.94 + (r() - 0.5) * 9;
      v = Math.round(Math.max(40, Math.min(400, v + ar)));
      const s = prev == null ? 0 : (v - prev) / 5; prev = v;
      entries.push([t, v, s > 3 ? 'DoubleUp' : s > 2 ? 'SingleUp' : s > 1 ? 'FortyFiveUp' : s < -3 ? 'DoubleDown' : s < -2 ? 'SingleDown' : s < -1 ? 'FortyFiveDown' : 'Flat']);
    }
    for (const [mh, , c] of meals) tr.push({ _id: 'g' + dayStart + mh, eventType: 'Meal Bolus', mills: dayStart + mh * H, created_at: new Date(dayStart + mh * H).toISOString(), carbs: Math.round(c / 5) * 5, insulin: Math.round(c / 15 * 2) / 2, enteredBy: u.device });
    tr.push({ _id: 'b' + dayStart, eventType: 'Basal Insulin', mills: dayStart + 21 * H, created_at: new Date(dayStart + 21 * H).toISOString(), insulin: 8, enteredBy: u.device });
    if (act) tr.push({ _id: 'a' + dayStart, eventType: 'Exercise', mills: dayStart + act * H, created_at: new Date(dayStart + act * H).toISOString(), duration: 45, notes: 'Football', enteredBy: u.device });
    const out = { entries, tr }; dayCache.set(key, out); return out;
  }
  const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  function series(u, from, to) {
    if (!u.dataFrom) return { entries: [], tr: [] };
    const a = Math.max(from, u.dataFrom), b = Math.min(to, Date.now());
    const E = [], T = [];
    for (let d = startOfDay(a); d < b; d += DAY) {
      const g = genDay(u, startOfDay(d + 2 * H));
      for (const e of g.entries) if (e[0] >= a && e[0] < b) E.push(e);
      for (const x of g.tr) if (x.mills >= a && x.mills < b) T.push(x);
    }
    for (const e of u.imported) if (e[0] >= from && e[0] < to) E.push(e);
    E.sort((x, y) => x[0] - y[0]);
    return { entries: E, tr: T };
  }

  // ---- demo state
  const users = [], shares = [], notes = [], links = [];
  function mkUser(o) {
    const u = { id: seq++, role: 'patient', lang: 'en', units: 'mmol', target_low: 70, target_high: 180, created_at: new Date().toISOString(), api_secret: secret(),
      seed: seq * 31, base: 135, sens: 1.6, hypo: 0.25, device: 'FreeStyle Libre 2', bridges: [], imported: [], diary: [], dataFrom: null, ...o };
    users.push(u); return u;
  }
  const P = mkUser({ email: 'demo@endocontrol.app', password: 'demo1234', name: 'Aigerim', patient_name: 'Alikhan (9)', diabetes_type: 't1', dataFrom: startOfDay(Date.now() - 89 * DAY) });
  P.bridges.push({ kind: 'librelinkup', status: 'ok', last_error: null, last_poll: Date.now(), last_data: Date.now() });
  const Dr = mkUser({ email: 'doctor@endocontrol.app', password: 'demo1234', name: 'Dr. Aizhan Nurlanova', role: 'doctor' });
  const tok0 = 'r-demo' + rid();
  shares.push({ token: tok0, user_id: P.id, label: 'Dr. Nurlanova', created_at: Date.now() - 20 * DAY, expires_at: null, revoked: 0 });
  links.push({ doctor_id: Dr.id, token: tok0, added_at: Date.now() - 20 * DAY });
  notes.push({ id: seq++, user_id: P.id, author_id: Dr.id, kind: 'conclusion', text: 'Time in range is close to the goal. Night lows around 3 a.m. on some days — reduce basal insulin by 1 U and check again in 2 weeks.', created_at: Date.now() - 6 * DAY });
  notes.push({ id: seq++, user_id: P.id, author_id: P.id, kind: 'message', text: 'Thank you! We reduced it. Can you look at the afternoon highs after school?', created_at: Date.now() - 3 * H });

  let session = null;
  const err = (status, code) => { const e = new Error(code); e.status = status; e.code = code; throw e; };
  const me = () => session || err(401, 'unauthorized');
  const pub = u => ({
    id: u.id, email: u.email, name: u.name, role: u.role, patient_name: u.patient_name, birth_year: null, diabetes_type: u.diabetes_type, lang: u.lang, units: u.units,
    target_low: u.target_low, target_high: u.target_high, created_at: u.created_at,
    upload: { base_url: 'https://endocontrol.example', api_secret: u.api_secret, xdrip_url: `https://${u.api_secret}@endocontrol.example/api/v1/` },

  const shareOk = tk => { const s = shares.find(x => x.token === tk && !x.revoked && (!x.expires_at || x.expires_at > Date.now())); return s || err(404, 'share_not_found'); };
  const subject = q => q.get('share') ? users.find(u => u.id === shareOk(q.get('share')).user_id) : me();
  const patientInfo = u => ({ name: u.name, patient_name: u.patient_name, birth_year: null, diabetes_type: u.diabetes_type, units: u.units, target_low: u.target_low, target_high: u.target_high });

  const R = [];
  const on = (m, re, fn) => R.push([m, re, fn]);
  on('POST', /^\/app\/register$/, b => {
    if (users.some(u => u.email === String(b.email).toLowerCase())) err(409, 'email_taken');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(b.email || '')) err(400, 'bad_email');
    session = mkUser({ email: String(b.email).toLowerCase(), password: b.password, name: b.name, role: b.role === 'doctor' ? 'doctor' : 'patient', patient_name: b.patient_name, diabetes_type: b.diabetes_type, lang: b.lang, units: b.units === 'mg/dl' ? 'mg/dl' : 'mmol', base: 150, sens: 1.9, hypo: 0.15 });
    return { ok: true };
  });
  on('POST', /^\/app\/login$/, b => { const u = users.find(x => x.email === String(b.email).toLowerCase().trim() && x.password === b.password); if (!u) err(401, 'bad_credentials'); session = u; return { ok: true }; });
  on('POST', /^\/app\/logout$/, () => { session = null; return { ok: true }; });
  on('GET', /^\/app\/me$/, () => {
    const u = me(); const s = series(u, Date.now() - 2 * H, Date.now() + 60e3); const last = s.entries[s.entries.length - 1];
    u.bridges.forEach(b => { if (b.status === 'ok') { b.last_poll = Date.now(); b.last_data = last ? last[0] : null; } });
    const total = u.dataFrom ? Math.floor((Date.now() - u.dataFrom) / 3e5) + u.imported.length : u.imported.length;
    return { user: pub(u), bridges: u.bridges, last: last ? { date: last[0], sgv: last[1], direction: last[2], device: u.device, source: u.bridges[0] ? u.bridges[0].kind : 'csv' } : null, stored: total, app: { name: 'EndoControl (demo)', version: '0.1.0' } };
  });
  on('PUT', /^\/app\/me$/, b => { const u = me(); for (const k of ['name', 'patient_name', 'lang', 'units', 'target_low', 'target_high']) if (b[k] !== undefined && b[k] !== '') u[k] = b[k]; return { ok: true }; });
  on('POST', /^\/app\/me\/password$/, b => { const u = me(); if (b.current !== u.password) err(401, 'bad_credentials'); u.password = b.password; return { ok: true }; });
  on('POST', /^\/app\/me\/rotate-secret$/, () => { me().api_secret = secret(); return { ok: true }; });
  on('POST', /^\/app\/me\/delete$/, b => { const u = me(); if (b.password !== u.password) err(401, 'bad_credentials'); users.splice(users.indexOf(u), 1); session = null; return { ok: true }; });
  on('GET', /^\/app\/data$/, (b, q) => {
    const u = subject(q); const to = +q.get('to') || Date.now(), from = +q.get('from') || to - DAY;
    const s = series(u, from, to);
    const tr = [...s.tr, ...u.diary.filter(x => x.mills >= from && x.mills < to)].sort((a, c) => a.mills - c.mills);
    return { from, to, entries: s.entries, treatments: tr, patient: patientInfo(u), readOnly: !!q.get('share') };
  });
  on('POST', /^\/app\/treatments$/, b => {
    const u = me(); const at = Date.parse(b.at) || Date.now();
    const k = { carbs: { eventType: 'Carb Correction', carbs: b.value }, insulin: { eventType: b.basal ? 'Basal Insulin' : 'Correction Bolus', insulin: b.value }, bg: { eventType: 'BG Check', glucose: b.value, units: 'mg/dl' }, exercise: { eventType: 'Exercise', duration: b.value }, note: { eventType: 'Note' } }[b.kind];
    const x = { _id: 'u' + seq++, ...k, mills: at, created_at: new Date(at).toISOString(), notes: b.notes || undefined, enteredBy: 'EndoControl' };

  on('DELETE', /^\/app\/treatments\/(.+)$/, (b, q, m) => { const u = me(); u.diary = u.diary.filter(x => x._id !== m[1]); return { ok: true }; });
  on('POST', /^\/app\/bridges$/, b => {

    if (b.kind === 'nightscout' && !/^https:\/\//i.test(c.url || '')) err(400, 'bad_url');
    u.bridges = u.bridges.filter(x => x.kind !== b.kind);
    u.bridges.push({ kind: b.kind, status: 'ok', last_error: null, last_poll: Date.now(), last_data: Date.now() });
    if (b.kind === 'dexcom') u.device = 'Dexcom G7';

  });
  on('DELETE', /^\/app\/bridges\/(.+)$/, (b, q, m) => { const u = me(); u.bridges = u.bridges.filter(x => x.kind !== m[1]); return { ok: true }; });
  on('POST', /^\/app\/import$/, (text, q) => {
    const u = me(); const { entries, detected } = window.ECCsv.parseCsv(text, q.get('tz_offset'));
    if (!entries.length) err(400, 'nothing_imported');
    for (const e of entries) u.imported.push([e.date, e.sgv, null]);
    return { imported: entries.length, detected };
  });
  on('GET', /^\/app\/shares$/, () => shares.filter(s => s.user_id === me().id && !s.revoked));
  on('POST', /^\/app\/shares$/, b => { const t = 'r-' + rid() + rid(); shares.push({ token: t, user_id: me().id, label: b.label || null, created_at: Date.now(), expires_at: b.days > 0 ? Date.now() + b.days * DAY : null, revoked: 0 }); return { token: t }; });
  on('DELETE', /^\/app\/shares\/(.+)$/, (b, q, m) => { const s = shares.find(x => x.token === m[1] && x.user_id === me().id); if (s) s.revoked = 1; return { ok: true }; });
  on('GET', /^\/app\/share\/(.+)$/, (b, q, m) => { const s = shareOk(decodeURIComponent(m[1])); return { patient: patientInfo(users.find(u => u.id === s.user_id)), label: s.label, expires_at: s.expires_at }; });

    const d = me();

      const s = shares.find(x => x.token === l.token && !x.revoked); if (!s) return null;

      const se = series(u, Date.now() - 14 * DAY, Date.now() + 60e3).entries;

      const last = se[se.length - 1];
      return { token: l.token, added_at: l.added_at, ...patientInfo(u), last: last ? { date: last[0], sgv: last[1], direction: last[2] } : null, tir: n ? inr / n * 100 : null, tbr: n ? low / n * 100 : null,
        mean: n ? se.reduce((a, e) => a + e[1], 0) / n : null, messages: notes.filter(x => x.user_id === u.id && x.author_id === u.id && x.created_at > l.added_at).length };
    }).filter(Boolean);
  });
  on('POST', /^\/app\/patients$/, b => {
    const d = me(); let tk = String(b.token || '').trim(); const m = /[#/]s\/([\w-]+)/.exec(tk); if (m) tk = m[1];
    shareOk(tk); if (!links.some(l => l.doctor_id === d.id && l.token === tk)) links.push({ doctor_id: d.id, token: tk, added_at: Date.now() });
    return { ok: true, token: tk };
  });
  on('DELETE', /^\/app\/patients\/(.+)$/, (b, q, m) => { const d = me(); const i = links.findIndex(l => l.doctor_id === d.id && l.token === m[1]); if (i >= 0) links.splice(i, 1); return { ok: true }; });
  on('GET', /^\/app\/notes$/, (b, q) => {
    const u = subject(q);
    return notes.filter(n => n.user_id === u.id).sort((a, c) => a.created_at - c.created_at).map(n => { const a = users.find(x => x.id === n.author_id) || {}; return { ...n, author: a.name, author_role: a.role, mine: session && session.id === n.author_id }; });
  });
  on('POST', /^\/app\/notes$/, b => {
    const u = me(); let pid = u.id;
    if (b.share) { pid = shareOk(b.share).user_id; if (!links.some(l => l.doctor_id === u.id && l.token === b.share)) err(403, 'forbidden'); }
    notes.push({ id: seq++, user_id: pid, author_id: u.id, kind: b.kind === 'conclusion' && u.role === 'doctor' ? 'conclusion' : 'message', text: String(b.text || '').slice(0, 5000), created_at: Date.now() });
    return { ok: true };
  });

  const realFetch = window.fetch.bind(window);
  window.fetch = async (input, opt = {}) => {
    const url = new URL(typeof input === 'string' ? input : input.url, location.href);
    if (!url.pathname.startsWith('/app/')) return realFetch(input, opt);
    const method = (opt.method || 'GET').toUpperCase();
    let body = opt.body;
    if (body && (opt.headers || {})['Content-Type'] === 'application/json') body = JSON.parse(body);
    await new Promise(r => setTimeout(r, 60));
    for (const [m, re, fn] of R) {
      const mm = method === m && re.exec(url.pathname);

      try { const out = fn(body || {}, url.searchParams, mm); return new Response(JSON.stringify(out), { status: 200, headers: { 'Content-Type': 'application/json' } }); }

    }
    return new Response(JSON.stringify({ status: 404, error: 'not_found' }), { status: 404, headers: { 'Content-Type': 'application/json' } });
  };
})();

<script>'use strict';
/* EndoControl web app — vanilla JS single-page app (no build step). */
(function () {
  const C = window.Charts, I = window.I18N;
  const esc = C.esc;
  const $ = s => document.querySelector(s);
  const S = { me: null, lang: I.detect(), units: 'mg/dl', timer: null };

  // ------------------------------------------------------------ i18n
  const t = (k, vars) => I.t(S.lang, k, vars);
  function setLang(l) {
    S.lang = l; I.save(l);
    document.documentElement.lang = l;
    document.documentElement.dir = I.rtl(l) ? 'rtl' : 'ltr';
    $('#langSel').value = l;
  }
  const locale = () => I.locale(S.lang);
  const fmtTime = ms => new Date(ms).toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' });
  const fmtDate = (ms, o = { day: '2-digit', month: '2-digit', year: 'numeric' }) => new Date(ms).toLocaleDateString(locale(), o);
  const fmtDT = ms => `${fmtDate(ms, { day: '2-digit', month: 'short' })} ${fmtTime(ms)}`;
  const G = mg => C.fmtG(mg, S.units);
  const UL = () => C.unitLabel(S.units);
  const toMg = v => S.units === 'mmol' ? Math.round(parseFloat(String(v).replace(',', '.')) * C.MMOL) : Math.round(parseFloat(v));
  function ago(ms) {
    const m = Math.round((Date.now() - ms) / 60e3);
    if (m < 1) return t('justNow');
    if (m < 60) return t('minAgo', { n: m });
    const h = Math.round(m / 60); if (h < 48) return t('hAgo', { n: h });
    return fmtDT(ms);
  }

  // ------------------------------------------------------------ api
  async function api(method, path, body, raw) {
    const opt = { method, headers: { 'X-EC': '1' }, credentials: 'same-origin' };
    if (body !== undefined) { if (raw) { opt.body = body; opt.headers['Content-Type'] = 'text/csv'; } else { opt.body = JSON.stringify(body); opt.headers['Content-Type'] = 'application/json'; } }
    const r = await fetch(path, opt);
    const ct = r.headers.get('content-type') || '';
    const data = ct.includes('json') ? await r.json() : await r.text();
    if (!r.ok) { const e = new Error(data && data.error || 'error'); e.code = data && data.error; e.status = r.status; e.detail = data && data.message; throw e; }
    return data;
  }
  const errText = e => (e && e.code && I.has(S.lang, 'e_' + e.code)) ? t('e_' + e.code) : (e && e.detail) || t('e_generic');

  function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2800); }

    else if (S.me) items = [['home', '🏠', 'navHome'], ['diary', '📔', 'navDiary'], ['reports', '📊', 'navReports'], ['ai', '✨', 'navAi'], ['share', '🩺', 'navDoctor'], ['settings', '⚙️', 'navSettings']];
    const html = items.map(([id, ic, k]) => `<a href="#/${id}" class="${r === id || (id === 'home' && r === 'connect') ? 'on' : ''}"><span>${ic}</span>${esc(t(I.has('en', k + 'Short') ? k + 'Short' : k))}</a>`).join('');
    $('#mainnav').innerHTML = items.map(([id, , k]) => `<a href="#/${id}" class="${r === id ? 'on' : ''}">${esc(t(k))}</a>`).join('');
    $('#bottomnav').innerHTML = html;
    $('#bottomnav').style.display = items.length ? '' : 'none';
    const lb = $('#logoutBtn'); lb.hidden = !S.me; lb.textContent = t('logout');
  }
  function fillLangs() {
    $('#langSel').innerHTML = I.LANGS.map(l => `<option value="${l.code}">${esc(l.name)}</option>`).join('');
    $('#langSel').value = S.lang;
    $('#langSel').onchange = async e => {
      setLang(e.target.value);
      if (S.me) { try { await api('PUT', '/app/me', { lang: S.lang }); } catch { } }
      route();
    };
    $('#logoutBtn').onclick = async () => { await api('POST', '/app/logout').catch(() => { }); S.me = null; location.hash = '#/login'; };
  }

  async function loadMe() {
    try { S.me = await api('GET', '/app/me'); S.units = S.me.user.units; if (S.me.user.lang && S.me.user.lang !== S.lang && !I.saved()) setLang(S.me.user.lang); }
    catch { S.me = null; }
    return S.me;
  }

  // ------------------------------------------------------------ router
  async function route() {
    clearInterval(S.timer);
    const parts = location.hash.replace(/^#\/?/, '').split('/');

  // ------------------------------------------------------------ auth pages
  function pwStrength(p) { let s = 0; if (p.length >= 8) s++; if (p.length >= 12) s++; if (/\d/.test(p) && /\p{L}/u.test(p)) s++; if (/[^\p{L}\d]/u.test(p)) s++; return s; }

  function login() {

  // ------------------------------------------------------------ data helpers
  async function getData(fromMs, toMs, share) {
    const q = new URLSearchParams({ from: Math.round(fromMs), to: Math.round(toMs) });
    if (share) q.set('share', share);
    const d = await api('GET', '/app/data?' + q);
    d.treatments.forEach(x => { x.mills = x.mills || Date.parse(x.created_at); });
    return d;
  }
  const targets = p => ({ lo: (p && p.target_low) || 70, hi: (p && p.target_high) || 180 });
  const dayStart = (ms, offsetDays = 0) => { const d = new Date(ms); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + offsetDays); return d.getTime(); };

  function metricsHtml(st, lo, hi) {
    if (!st.n) return `<div class="muted">${esc(t('noData'))}</div>`;
    const m = (l, v, sub, col) => `<div class="metric"><div class="l">${esc(l)}</div><div class="v" ${col ? `style="color:${col}"` : ''}>${v}</div><div class="t">${esc(sub)}</div></div>`;
    return `<div class="grid g4">
      ${m(t('tir'), st.tir.toFixed(0) + '%', t('goal') + ' >70%', st.tir >= 70 ? 'var(--in)' : 'var(--high)')}
      ${m(t('tbr'), st.tbr.toFixed(1) + '%', t('goal') + ' <4%', st.tbr < 4 ? 'var(--in)' : 'var(--low)')}
      ${m(t('mean'), G(st.mean), UL())}
      ${m('GMI', st.gmi.toFixed(1) + '%', 'CV ' + st.cv.toFixed(0) + '% · ' + t('goal') + ' ≤36%')}</div>`;
  }
  function trTitle(x) {
    if (x.carbs && x.insulin) return t('tMeal');
    if (x.carbs) return t('tCarbs');
    if (x.insulin) return /basal/i.test(x.eventType) ? t('tBasal') : t('tInsulin');
    if (x.glucose) return t('tBg');
    if (/exercise/i.test(x.eventType)) return t('tExercise');
    if (/sensor/i.test(x.eventType)) return t('tSensor');
    return x.eventType === 'Note' || x.eventType === '<none>' ? t('tNote') : x.eventType;
  }
  function trValue(x) {
    const p = [];
    if (x.carbs) p.push(`${+x.carbs} ${t('gCarbs')}`);
    if (x.insulin) p.push(`${+x.insulin} ${t('uIns')}`);
    if (x.glucose) p.push(`${G(x.units === 'mmol' ? x.glucose * C.MMOL : x.glucose)} ${UL()}`);
    if (x.duration) p.push(`${x.duration} ${t('min')}`);
    return p.join(' · ');
  }

  // Big current-glucose card, coloured by range
  function heroHtml(last, lo, hi, name, metaHtml, extra) {
    const v = last ? last[1] : null;
    const st = v == null ? 'none' : v < 54 ? 'vlow' : v < lo ? 'low' : v <= hi ? 'in' : v <= 250 ? 'high' : 'vhigh';
    const label = { none: '', vlow: t('veryLow'), low: t('low'), in: t('inRange'), high: t('high'), vhigh: t('veryHigh') }[st];
    return `<div class="hero-card st-${st}"><div class="now">
      <div class="valbox"><div class="val">${v != null ? G(v) : '—'}<span class="arrow">${last ? (C.ARROWS[last[2]] || '') : ''}</span></div><div class="unit">${UL()}${label ? ` · <b>${esc(label)}</b>` : ''}</div></div>
      <div class="grow"><div class="who">${esc(name)}</div><div class="meta">${metaHtml}</div></div>
      ${extra || ''}</div></div>`;
  }

  // ------------------------------------------------------------ home
  async function home() {
    const me = S.me = await api('GET', '/app/me');
    S.units = me.user.units;
    let range = Number(sessionStorage.getItem('range') || 24);
    const draw = async () => {
      const now = Date.now();
      const d = await getData(now - range * 3600e3, now + 60e3);
      const { lo, hi } = targets(me.user);
      const last = d.entries[d.entries.length - 1];
      const today = d.entries.filter(e => e[0] >= dayStart(now)).map(e => e[1]);
      const st = C.stats(today, lo, hi);
      const stale = !last || now - last[0] > 15 * 60e3;
      const noSource = !me.bridges.length && !me.last;
      $('#view').innerHTML = `
      ${noSource ? `<div class="cta"><h2>${esc(t('connectFirst'))}</h2><p>${esc(t('connectFirstText'))}</p><a class="btn" href="#/connect">${esc(t('connectSensor'))}</a></div>` : ''}
      ${heroHtml(last, lo, hi, me.user.patient_name || me.user.name, (last ? esc(ago(last[0])) : esc(t('noData'))) + (stale && last ? ` · ${esc(t('stale'))}` : ''), `<div class="seg" id="rng">${[3, 6, 12, 24].map(h => `<button data-h="${h}" class="${h === range ? 'on' : ''}">${h}${esc(t('hShort'))}</button>`).join('')}</div>`)}
      <div class="card chartcard">
      ${C.line(d.entries, now - range * 3600e3, now + 5 * 60e3, { lo, hi, units: S.units, treatments: d.treatments, locale: locale(), label: t('glucose') })}
      <div class="legend"><i style="background:var(--ins)"></i>${esc(t('tInsulin'))}<i style="background:var(--carb)"></i>${esc(t('tCarbs'))}<i style="background:var(--in-soft);border:1px solid var(--in)"></i>${esc(t('targetRange'))} ${G(lo)}–${G(hi)}</div>
      </div>
      <div class="quick no-print">${[['carbs', '🍽', 'tCarbs'], ['insulin', '💉', 'tInsulin'], ['bg', '🩸', 'tBg'], ['exercise', '🏃', 'tExercise'], ['note', '📝', 'tNote']].map(q => `<button data-q="${q[0]}"><span>${q[1]}</span>${esc(t(q[2]))}</button>`).join('')}</div>
      <div class="grid g2" style="margin-top:12px">
        <div class="card"><h2>${esc(t('today'))}</h2>${metricsHtml(st, lo, hi)}</div>
        <div class="card"><h2>${esc(t('dataSources'))}</h2>${sourcesHtml(me)}<a class="btn ghost sm" href="#/connect" style="margin-top:8px">${esc(t('connectSensor'))}</a></div>
      </div>`;
      document.querySelectorAll('#rng button').forEach(b => b.onclick = () => { range = +b.dataset.h; sessionStorage.setItem('range', range); draw(); });
      document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => addEntry(b.dataset.q, draw));
    };
    await draw();
    S.timer = setInterval(() => { if (!$('#modal').innerHTML) draw().catch(() => { }); }, 60e3);
  }

  function sourcesHtml(me) {
    const names = { librelinkup: 'LibreLinkUp', dexcom: 'Dexcom Share', nightscout: 'Nightscout' };
    let h = me.bridges.map(b => `<div class="status"><span class="dot ${b.status === 'ok' ? 'ok' : b.status === 'error' ? 'err' : 'wait'}"></span><div class="grow">
      <b>${esc(names[b.kind] || b.kind)}</b><div class="small muted">${b.status === 'ok' ? esc(t('bridgeOk', { time: b.last_data ? ago(b.last_data) : '—' })) : b.status === 'error' ? esc(bridgeErr(b.last_error)) : esc(t('bridgeWait'))}</div></div></div>`).join('');
    if (me.last && !me.bridges.some(b => b.kind === me.last.source)) h += `<div class="status"><span class="dot ok"></span><div class="grow"><b>${esc(me.last.device || t('uploaderApp'))}</b><div class="small muted">${esc(t('lastValue'))}: ${esc(ago(me.last.date))}</div></div></div>`;
    if (!h) h = `<div class="muted small">${esc(t('noSources'))}</div>`;
    return h + `<div class="tiny muted" style="margin-top:6px">${esc(t('storedCount', { n: (me.stored || 0).toLocaleString(locale()) }))}</div>`;
  }
  const bridgeErr = s => { const code = String(s || '').split(':')[0]; return I.has(S.lang, 'b_' + code) ? t('b_' + code) : (s || t('e_generic')); };

  function addEntry(kind, done) {
    const isVal = kind !== 'note';
    const unit = { carbs: t('gCarbs'), insulin: t('uIns'), bg: UL(), exercise: t('min') }[kind];
    const nowLocal = new Date(Date.now() - new Date().getTimezoneOffset() * 60e3).toISOString().slice(0, 16);
    modal(`<h2>${esc(t({ carbs: 'tCarbs', insulin: 'tInsulin', bg: 'tBg', exercise: 'tExercise', note: 'tNote' }[kind]))}</h2>
      <form id="ef">
      ${isVal ? `<div class="fld"><label for="ev">${esc(t('amount'))}, ${esc(unit)}</label><input id="ev" type="number" inputmode="decimal" step="any" min="0" required></div>` : ''}
      ${kind === 'insulin' ? `<label class="check"><input type="checkbox" id="eb"> ${esc(t('tBasal'))}</label>` : ''}
      <div class="fld"><label for="et">${esc(t('time'))}</label><input id="et" type="datetime-local" value="${nowLocal}"></div>
      <div class="fld"><label for="en">${esc(t('comment'))}</label><input id="en" maxlength="1000"></div>
      <div class="err" id="eerr"></div>
      <div class="row"><button class="btn grow">${esc(t('save'))}</button><button type="button" class="btn ghost" data-close>${esc(t('cancel'))}</button></div></form>`, () => {
      $('#ef').onsubmit = async e => {
        e.preventDefault();
        let value = isVal ? $('#ev').value : undefined;
        if (kind === 'bg') value = toMg(value);
        try {
          await api('POST', '/app/treatments', { kind, value: value !== undefined ? Number(value) : undefined, basal: kind === 'insulin' && $('#eb').checked, notes: $('#en').value, at: new Date($('#et').value).toISOString() });
          closeModal(); toast(t('saved')); done && done();
        } catch (er) { $('#eerr').textContent = errText(er); }
      };
    });
  }

  function medianGap(es) { const g = []; for (let i = 1; i < Math.min(es.length, 500); i++) g.push(es[i][0] - es[i - 1][0]); g.sort((a, b) => a - b); return g[Math.floor(g.length / 2)] || 5 * 60e3; }
  function insights(entries, lo, hi) {
    const out = [];
    const block = (h1, h2) => C.stats(entries.filter(e => { const h = new Date(e[0]).getHours(); return h >= h1 && h < h2; }).map(e => e[1]), lo, hi);
    const night = block(0, 6), morning = block(6, 10), aft = block(12, 18), eve = block(18, 24);
    if (night.n && night.tbr > 4) out.push(t('insNightLow', { p: night.tbr.toFixed(0) }));
    if (night.n && morning.n && morning.mean - night.mean > 25) out.push(t('insDawn', { d: G(morning.mean - night.mean), u: UL() }));
    if (aft.n && aft.tar > 40) out.push(t('insAfternoon', { p: aft.tar.toFixed(0) }));
    if (eve.n && eve.tar > 40) out.push(t('insEvening', { p: eve.tar.toFixed(0) }));
    const all = C.stats(entries.map(e => e[1]), lo, hi);
    if (all.cv > 36) out.push(t('insCv', { p: all.cv.toFixed(0) }));
    if (!out.length) out.push(t('insGood'));
    return out;
  }

  // ------------------------------------------------------------ AI analyst
  // Light markdown for answers: **bold**, "- " / "1. " lists, paragraphs. Escapes everything first.
  function aiMd(text) {
    return esc(text).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').split(/\n{2,}/).map(par => {
      const lines = par.split('\n').filter(l => l.trim());
      if (lines.length && lines.every(l => /^\s*([-•*]|\d+[.)])\s/.test(l))) {
        const tag = /^\s*\d/.test(lines[0]) ? 'ol' : 'ul';
        return `<${tag}>${lines.map(l => `<li>${l.replace(/^\s*([-•*]|\d+[.)])\s/, '')}</li>`).join('')}</${tag}>`;
      }
      return `<p>${lines.join('<br>')}</p>`;
    }).join('');
  }
  async function ai() {
    const me = S.me;
    const to = Date.now() + 60e3, from = to - 14 * 864e5;
    const [d, status] = await Promise.all([getData(from, to), api('GET', '/app/ai').catch(() => ({ enabled: false }))]);
    const { lo, hi } = targets(me.user);
    const st = C.stats(d.entries.map(e => e[1]), lo, hi);
    const found = insights(d.entries, lo, hi);
    const ruleAnswer = q => {
      const recent = /\b7\b/.test(q) ? d.entries.filter(e => e[0] >= to - 7 * 864e5) : d.entries;
      return insights(recent, lo, hi).map(x => '- ' + x).join('\n') + '\n\n' + t('aiRuleNote');
    };
    const chat = S.aiChat = S.aiChat || [];
    let busy = false, note = status.enabled ? t('aiPrivacy') : t('aiOff');
    const chips = t('aiChips').split('|');
    $('#view').innerHTML = `<h1>✨ ${esc(t('navAi'))}</h1>
      <div class="card"><p class="muted small" style="margin-top:0">${esc(t('aiIntro'))}</p>${metricsHtml(st, lo, hi)}
        <h2 style="margin-top:16px">${esc(t('aiSeen'))}</h2>${found.map(x => `<div class="ins">${esc(x)}</div>`).join('')}</div>
      <div class="card"><h2>${esc(t('aiAsk'))}</h2><div class="chat" id="chat"></div><div class="chips" id="chips"></div>
        <form id="aiForm" class="aiform"><input id="aiIn" maxlength="2000" autocomplete="off" placeholder="${esc(t('aiPlaceholder'))}" aria-label="${esc(t('aiAsk'))}">
          <button class="btn" id="aiSend" aria-label="${esc(t('aiSend'))}">➤</button></form>
        <p class="tiny muted" id="aiNote" style="margin-bottom:0"></p></div>`;
    const draw = () => {
      $('#chat').innerHTML = chat.map(m => `<div class="msg ${m.role === 'user' ? 'u' : 'a'}${m.pending ? ' pending' : ''}">${m.role === 'user' ? esc(m.text) : aiMd(m.text)}</div>`).join('');
      $('#chips').innerHTML = chat.length ? '' : chips.map(c => `<button type="button" class="chip">${esc(c)}</button>`).join('');
      document.querySelectorAll('#chips .chip').forEach(b => b.onclick = () => ask(b.textContent));
      $('#aiSend').disabled = busy;
      $('#aiNote').textContent = note;
      const last = $('#chat').lastElementChild; if (last) last.scrollIntoView({ block: 'nearest' });
    };
    async function ask(q) {
      q = String(q || '').trim();
      if (!q || busy) return;
      const history = chat.filter(m => !m.pending && !m.local).map(m => ({ role: m.role, text: m.text }));
      chat.push({ role: 'user', text: q });
      const reply = { role: 'assistant', text: t('aiThinking'), pending: true };
      chat.push(reply); busy = true; draw();
      try {
        const r = await api('POST', '/app/ai', { question: q, history, lang: S.lang, tz: Intl.DateTimeFormat().resolvedOptions().timeZone });
        if (r.mode === 'off') { reply.text = ruleAnswer(q); reply.local = true; note = t('aiOff'); }
        else if (r.refusal || !r.text) { reply.text = t('aiRefusal'); reply.local = true; }
        else { reply.text = r.text; note = t('aiPrivacy'); }
      } catch (e) {
        // The offline demo has no AI endpoint: fall back to the rule-based review.
        if (e.code === 'not_found') { reply.text = ruleAnswer(q); note = t('aiOff'); }
        else reply.text = errText(e);
        reply.local = true;
      }
      reply.pending = false; busy = false;
      const chatEl = $('#chat');
      if (chatEl) draw();
    }
    $('#aiForm').onsubmit = e => { e.preventDefault(); const v = $('#aiIn').value; $('#aiIn').value = ''; ask(v); };
    draw();
  }

    let tab = 'overview', days = 14;
    const draw = async () => {
      $('#view').innerHTML = `<div class="card no-print small">${esc(t('sharedBanner'))}${S.me && S.me.user.role === 'doctor' ? ` <button class="btn sm" id="addme">${esc(t('addToPatients'))}</button>` : ''}</div>
        <div class="seg no-print" id="tabs" style="margin-bottom:12px">${[['overview', 'overview'], ['report', 'navReports']].map(([id, k]) => `<button data-t="${id}" class="${tab === id ? 'on' : ''}">${esc(t(k))}</button>`).join('')}</div><div id="tb" class="loading">${esc(t('loading'))}</div>`;
      document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; draw(); });
      const am = $('#addme'); if (am) am.onclick = async () => { await api('POST', '/app/patients', { token }); location.hash = '#/p/' + token; };
      if (tab === 'overview') $('#tb').outerHTML = `<div id="tb">${await overviewHtml(token, name)}</div>`;
      else { $('#tb').outerHTML = `<div id="tb">${reportControls(null, days)}<div id="rep">${await reportHtml(token, days, name)}</div></div>`; wireReport(n => { days = n; draw(); }); }
    };
    await draw();
  }

  // ------------------------------------------------------------ settings
  async function settings() {
    const me = S.me = await api('GET', '/app/me');
    const u = me.user; const doc = u.role === 'doctor';
    const v = mg => S.units === 'mmol' ? (mg / C.MMOL).toFixed(1) : mg;
    $('#view').innerHTML = `<h1>${esc(t('navSettings'))}</h1>
      <form class="card" id="pf"><h2>${esc(t('profile'))}</h2>
        <div class="grid g2"><div class="fld"><label>${esc(t(doc ? 'yourNameDoctor' : 'yourName'))}</label><input name="name" value="${esc(u.name)}"></div>
        ${doc ? '' : `<div class="fld"><label>${esc(t('patientName'))}</label><input name="patient_name" value="${esc(u.patient_name || '')}"></div>`}
        <div class="fld"><label>${esc(t('units'))}</label><select name="units"><option value="mmol" ${u.units === 'mmol' ? 'selected' : ''}>mmol/L</option><option value="mg/dl" ${u.units === 'mg/dl' ? 'selected' : ''}>mg/dL</option></select></div>
        ${doc ? '' : `<div class="fld"><label>${esc(t('targetRange'))} (${UL()})</label><div class="row" style="flex-wrap:nowrap"><input name="lo" type="number" step="any" value="${v(u.target_low)}"><span>–</span><input name="hi" type="number" step="any" value="${v(u.target_high)}"></div></div>`}</div>
        <div class="tiny muted">${esc(t('email'))}: ${esc(u.email)}</div>
        <button class="btn" style="margin-top:10px">${esc(t('save'))}</button></form>
      ${doc ? '' : `<div class="card"><h2>📡 ${esc(t('uploadSettings'))}</h2><p class="small muted">${esc(t('uploadSettingsText'))}</p>${uploaderBox(u.upload)}
        <div class="row"><button class="btn sm red" id="rot">${esc(t('newSecret'))}</button>${window.EC_DEMO ? '' : `<a class="btn sm ghost" href="/app/export.csv">${esc(t('exportCsv'))}</a>`}</div></div>`}
      <form class="card" id="cp"><h2>🔒 ${esc(t('changePassword'))}</h2><div class="grid g2"><div class="fld"><label>${esc(t('currentPassword'))}</label><input type="password" name="current" autocomplete="current-password" required></div>
        <div class="fld"><label>${esc(t('newPassword'))}</label><input type="password" name="password" autocomplete="new-password" required></div></div><div class="err" id="cperr"></div><button class="btn">${esc(t('save'))}</button></form>
      <form class="card" id="del"><h2>${esc(t('deleteAccount'))}</h2><p class="small muted">${esc(t('deleteText'))}</p><div class="row"><input type="password" name="password" placeholder="${esc(t('password'))}" required style="max-width:260px"><button class="btn red">${esc(t('deleteAccount'))}</button></div><div class="err" id="delerr"></div></form>
      <p class="tiny muted">${esc(me.app.name)} ${esc(me.app.version)} · ${esc(t('compatNote'))}</p>`;
    document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copy(b.dataset.copy));
    $('#pf').onsubmit = async e => {
      e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
      const conv = x => (S.units === 'mmol' ? Math.round(parseFloat(String(x).replace(',', '.')) * C.MMOL) : Math.round(+x));
      const body = { name: f.name, patient_name: f.patient_name, units: f.units, lang: S.lang };
      if (f.lo) { body.target_low = conv(f.lo); body.target_high = conv(f.hi); }
      await api('PUT', '/app/me', body); S.units = f.units; toast(t('saved')); settings();
    };
    const rot = $('#rot'); if (rot) rot.onclick = () => modal(`<h2>${esc(t('newSecret'))}</h2><p>${esc(t('newSecretWarn'))}</p><div class="row"><button class="btn red" id="ok">${esc(t('confirm'))}</button><button class="btn ghost" data-close>${esc(t('cancel'))}</button></div>`,
      () => { $('#ok').onclick = async () => { await api('POST', '/app/me/rotate-secret'); closeModal(); settings(); }; });
    $('#cp').onsubmit = async e => { e.preventDefault(); try { await api('POST', '/app/me/password', Object.fromEntries(new FormData(e.target))); toast(t('saved')); e.target.reset(); } catch (er) { $('#cperr').textContent = errText(er); } };
    $('#del').onsubmit = async e => { e.preventDefault(); try { await api('POST', '/app/me/delete', Object.fromEntries(new FormData(e.target))); S.me = null; location.hash = '#/login'; route(); } catch (er) { $('#delerr').textContent = errText(er); } };
  }

  // ------------------------------------------------------------ boot
  setLang(S.lang);
  fillLangs();
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
