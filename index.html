<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>DIA news</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Archivo:wdth,wght@62..100,500..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: tabloid news portal — navy masthead band, colour-coded section bar, red "breaking" ticker, then a main column (giant lead headline with bullet points, a pair of picture stories, a dense list of image-left rows) beside a "latest" rail */
:root{
  --bg:#ffffff; --surface:#ffffff; --soft:#f6f7f9; --fg:#0c1b26; --muted:#4f6474; --line:#d6e3e8;
  --navy:#0b0d12; --mint:#0e8a7a; --mint-soft:#dff2ee; --navy-ink:#ffffff; --hot:#d3192b; --link:#0b4f9c;
  --c-research:#6b4fd8; --c-approval:#1b8a58; --c-devices:#1672cc; --c-drugs:#d8452f; --c-access:#c27a00; --c-market:#0b8585; --c-events:#b0306e; --c-community:#4f7a12; --t1:#1672cc; --t2:#c27a00; --kid:#d3192b;
  --display:"Montserrat",Arial,sans-serif;
  --body:"Montserrat",Arial,sans-serif;
  --ui:"Montserrat",Arial,Helvetica,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark-disabled){:root:not([data-theme="light"]){
  --bg:#0b1118; --surface:#111a24; --soft:#16212d; --fg:#e9eef4; --muted:#9aabbc; --line:#253444;
  --navy:#0e2238; --navy-ink:#ffffff; --hot:#f0414f; --link:#7db7f2;
  --c-research:#a08cf2; --c-approval:#4cc48b; --c-devices:#5aa6ee; --c-drugs:#f27e6a; --c-access:#f0ad3d; --c-market:#3cc0c0; --c-events:#f07ab3; --c-community:#a3d45e; --t1:#5aa6ee; --t2:#f0ad3d; --kid:#f0414f; color-scheme:dark}}
:root[data-theme="dark-disabled"]{
  --bg:#0b1118; --surface:#111a24; --soft:#16212d; --fg:#e9eef4; --muted:#9aabbc; --line:#253444;
  --navy:#0e2238; --navy-ink:#ffffff; --hot:#f0414f; --link:#7db7f2;
  --c-research:#a08cf2; --c-approval:#4cc48b; --c-devices:#5aa6ee; --c-drugs:#f27e6a; --c-access:#f0ad3d; --c-market:#3cc0c0; --c-events:#f07ab3; --c-community:#a3d45e; --t1:#5aa6ee; --t2:#f0ad3d; --kid:#f0414f; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:#fff;color-scheme:light}
body{color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;padding:0;padding-bottom:48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--hot);outline-offset:2px}

/* masthead */
.mast{background:var(--bg);color:var(--navy);border-bottom:1px solid var(--line)}
.mast .in{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-block:14px 12px}
.brand{display:flex;align-items:center;gap:clamp(12px,2vw,20px);min-width:0}
.brand .mark{flex:none;width:clamp(44px,7vw,66px);height:auto;display:block}
.brand-txt{display:flex;flex-direction:column;gap:clamp(6px,1vw,10px);min-width:0}
.logo{display:flex;align-items:baseline;font-family:"Montserrat",Arial,sans-serif;font-weight:800;line-height:1;letter-spacing:-.02em;font-size:clamp(2rem,6.5vw,3.4rem);margin:0;color:#0b1f3a}
.logo .dot{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:#f26b4f;margin:0 .04em}
.logo .nw{color:#1e5bd6}
.brand .sub{font-family:var(--ui);font-weight:600;font-size:clamp(.72rem,1.4vw,.92rem);letter-spacing:.12em;text-transform:uppercase;color:#4a5a70;opacity:1}
.mast-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.today{font-family:var(--mono);font-size:.74rem;letter-spacing:.04em;opacity:.85}
.sub{font-family:var(--ui);font-weight:600;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.langs{display:flex;gap:2px}
.langs{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{font-family:var(--mono);font-size:.74rem;font-weight:500;background:transparent;color:var(--navy);border:0;border-radius:999px;padding:5px 10px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* section bar */
.sections{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:3px solid var(--navy);box-shadow:0 1px 0 var(--line)}
.sections .in{display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
.sections .in::-webkit-scrollbar{display:none}
.sections button{--c:var(--navy);flex:none;font-family:var(--ui);font-weight:800;font-stretch:85%;font-size:.86rem;text-transform:uppercase;letter-spacing:.03em;color:var(--fg);background:transparent;border:0;border-top:4px solid var(--c);padding:9px 14px 8px;cursor:pointer;white-space:nowrap}
.sections button[aria-pressed="true"]{background:var(--c);color:#fff}
.sections button:hover:not([aria-pressed="true"]){background:color-mix(in srgb,var(--c) 12%,transparent)}

/* breaking ticker */
.ticker{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--soft);min-width:0}
.ticker-lab{flex:none;background:var(--hot);color:#fff;font-family:var(--ui);font-weight:900;font-stretch:75%;text-transform:uppercase;letter-spacing:.05em;font-size:.86rem;padding:7px 12px;display:flex;align-items:center;gap:7px}
.ticker-lab::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.2s steps(2,start) infinite}
.ticker-win{overflow:hidden;flex:1;min-width:0;display:flex;align-items:center}
.ticker-track{display:inline-flex;gap:36px;white-space:nowrap;padding-left:16px;animation:run 60s linear infinite}
.ticker-win:hover .ticker-track{animation-play-state:paused}
.ticker-track button{background:none;border:0;padding:6px 0;color:var(--fg);font-family:var(--ui);font-weight:700;font-size:.9rem;cursor:pointer}
.ticker-track button::before{content:"■";color:var(--hot);font-size:.6em;margin-right:8px;vertical-align:.15em}
@keyframes run{to{transform:translateX(-50%)}}
@keyframes blink{to{visibility:hidden}}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none}.ticker-win{overflow-x:auto}.ticker-lab::before{animation:none}}

.hero{--ink:#0b0d12;--blue:#1d3fd8;background:#fff;color:var(--ink);overflow:hidden;border-bottom:1px solid var(--line)}
.hero .in{padding-block:20px 26px;display:flex;flex-direction:column;gap:14px}
.hx-meta{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;font-family:var(--ui);font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.hx-meta>:nth-child(2){color:var(--muted);font-weight:600}
.hx-meta>:nth-child(3){justify-self:end}
.hx-meta .dot{display:inline-flex;align-items:center;gap:8px}
.hx-meta .dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue)}
.hx-meta>:nth-child(3).dot::before{background:#9aa3ad;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.hx-stage{position:relative}
.kx{position:relative;z-index:1;margin:0;font-family:"Archivo","Arial Narrow",Arial,sans-serif;font-weight:900;font-stretch:62%;font-size:clamp(3.4rem,12.5vw,10.5rem);line-height:.86;letter-spacing:-.01em;text-transform:uppercase;color:var(--ink)}
.kx .ln{display:flex;align-items:center;gap:.14em;flex-wrap:wrap}
.kx .w{display:inline-block;opacity:0;transform:translateY(.3em);animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
.kx .ln:nth-child(1) .w:nth-child(1){animation-delay:.05s}.kx .ln:nth-child(1) .w:nth-child(2){animation-delay:.18s}.kx .ln:nth-child(1) .w:nth-child(3){animation-delay:.3s}.kx .ln:nth-child(2) .w{animation-delay:.42s}.kx .ln:nth-child(3) .w{animation-delay:.56s}
@keyframes up{to{opacity:1;transform:none}}
.kx .hl-l{color:var(--blue)}
.pill{position:relative;width:2.3em;height:.78em;border-radius:999px;overflow:hidden;background:#1b2330 center 35%/cover no-repeat;display:inline-flex;align-items:center;justify-content:center;gap:.12em;border:0;padding:0;cursor:pointer;flex:none;font:inherit}
.pill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(0,0,0,.05))}
.pill .pl-b{position:absolute;inset:0;z-index:1;display:flex;justify-content:center;line-height:1;align-items:center;gap:10px;font-family:var(--ui);font-stretch:100%;font-weight:800;font-size:clamp(.62rem,1.1vw,.9rem);letter-spacing:.12em;color:#fff;text-transform:uppercase}
.pill .pl-b i{width:2.6em;height:2.6em;border-radius:50%;background:#fff;display:inline-grid;place-items:center;color:var(--blue);font-style:normal;font-size:.9em;transition:transform .3s}
.pill:hover .pl-b i{transform:scale(1.12)}
.kx .rot{display:inline-block;overflow:hidden;padding-bottom:.05em;color:var(--blue)}
.kx .rot span{display:inline-block;white-space:nowrap}
.scrib{position:absolute;inset:-4% -1% -2% -1%;width:102%;height:106%;z-index:2;pointer-events:none;overflow:visible}
.scrib path{fill:none;stroke:var(--blue);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s .6s cubic-bezier(.45,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.scrib-dot{position:absolute;z-index:2;right:11%;bottom:36%;width:18px;height:18px;border-radius:50%;border:1.5px solid #c3c9d2;display:grid;place-items:center;opacity:0;animation:fade .4s 3.1s forwards}
.scrib-dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue)}
@keyframes fade{to{opacity:1}}
.hx-stats{position:absolute;right:0;bottom:4px;z-index:3;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-family:var(--ui);font-weight:700;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;text-align:right}
.hx-stats span{white-space:nowrap}.hx-stats span::before{content:"↘ ";color:var(--blue)}
.hx-bot{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:24px;align-items:end;padding-top:8px}
.hx-bot p{margin:0;max-width:40ch;font-size:1.08rem;line-height:1.45;text-wrap:pretty}
.now{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.now-img{width:96px;height:72px;border-radius:6px;background:#1b2330 center/cover no-repeat}
.now-k{display:flex;align-items:center;gap:7px;font-family:var(--ui);font-weight:800;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.now-k::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--hot)}
.now-t{display:block;font-family:var(--ui);font-weight:700;font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:4px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.now-d{font-family:var(--mono);font-size:.82rem;color:var(--blue)}
.now:hover .now-t{color:var(--ink)}
.hx-scroll{display:flex;align-items:center;gap:12px;font-family:var(--ui);font-weight:700;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;background:none;border:0;cursor:pointer;color:var(--ink);padding:0}
.hx-scroll i{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-style:normal;transition:background .2s,color .2s}
.hx-scroll:hover i{background:var(--ink);color:#fff}
.art-box{border-radius:10px}
.art-box img{object-position:50% 35%}
@media (max-width:820px){.hx-meta{grid-template-columns:1fr 1fr}.hx-meta>:nth-child(2){display:none}.hx-stats{position:static;align-items:flex-start;text-align:left;margin-top:14px}.scrib,.scrib-dot{display:none}.hx-bot{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.kx .w{animation:none;opacity:1;transform:none}.scrib path{animation:none;stroke-dashoffset:0}.scrib-dot{animation:none;opacity:1}}
.demo{font-family:var(--ui);font-size:.8rem;background:#fdf0dc;color:#7a4b00;padding:8px 12px;margin-top:12px}
.art-box{border-radius:10px}
.art-box img{object-position:50% 35%}
@media (max-width:760px){.hero-in{grid-template-columns:1fr}}
.meta-line{font-family:var(--mono);font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-block:12px}

/* page layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.maincol{display:flex;flex-direction:column;gap:22px;min-width:0}

/* shared article parts */
.art-box{position:relative;overflow:hidden;background:var(--c);max-width:100%}
.art-box svg,.art-box img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.tag{position:absolute;left:10px;top:10px;border-radius:999px;font-family:var(--ui);font-weight:800;font-stretch:80%;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;background:var(--c);color:#fff;padding:4px 9px}
.credit{position:absolute;right:0;bottom:0;max-width:70%;font-family:var(--ui);font-size:.68rem;line-height:1.3;background:rgba(8,14,22,.75);color:#fff;padding:3px 7px}
.credit a{color:#fff}
.edit-photo{position:absolute;right:8px;top:8px;font-family:var(--ui);font-size:.74rem;font-weight:700;background:rgba(255,255,255,.94);color:#0d1620;border:0;border-radius:999px;padding:4px 10px;cursor:pointer}
.kicker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--ui);font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.kicker .sec{color:var(--c)}
.kicker .stamp{color:#fff;background:var(--hot);padding:2px 7px}
.kicker .date{font-family:var(--mono);font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)}
.hl{font-family:var(--display);font-weight:800;font-stretch:78%;line-height:1.04;letter-spacing:-.005em;margin:0;text-wrap:balance;color:var(--fg)}
.hl button{all:unset;cursor:pointer}
.hl button:hover{color:var(--link)}
.hl button:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.dek{margin:0;max-width:66ch;color:var(--fg)}
.bullets{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-width:66ch}
.bullets li{position:relative;padding-left:20px;font-family:var(--ui);font-weight:700;font-size:1rem;line-height:1.35}
.bullets li::before{content:"";position:absolute;left:2px;top:.42em;width:9px;height:9px;background:var(--c)}
.bullets b{font-weight:800;color:var(--c);font-variant-numeric:tabular-nums}
.full{display:flex;flex-direction:column;gap:12px;max-width:66ch;font-size:1.06rem}
.full p{margin:0}
.full p:first-child::first-letter{font-family:var(--display);font-weight:900;float:left;font-size:3.3em;line-height:.82;padding:4px 8px 0 0;color:var(--c)}
.foot{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.more{font-family:var(--ui);font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--c);border:0;padding:6px 12px;cursor:pointer}
.src{font-family:var(--ui);font-size:.82rem;color:var(--muted);min-width:0}
.src a{color:var(--link);font-weight:700;overflow-wrap:anywhere}
.photo-form{display:grid;gap:8px;padding:12px 14px;background:var(--soft);border:1px solid var(--line);font-family:var(--ui)}
.photo-form label{font-size:.8rem;color:var(--muted);display:grid;gap:3px}
.photo-form input{font:inherit;font-size:.9rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);padding:6px 8px;min-width:0}
.photo-form .btns{display:flex;gap:8px;flex-wrap:wrap}
.photo-form .hint{font-size:.78rem;color:var(--muted)}
.photo-form .err{font-size:.82rem;color:var(--hot)}
.btn{font-family:var(--ui);font-size:.86rem;font-weight:700;padding:6px 14px;cursor:pointer;border:1px solid var(--c);background:var(--c);color:#fff}
.btn.ghost{background:transparent;color:var(--c)}

/* lead */
.story{--c:var(--navy);min-width:0}
.lead{display:flex;flex-direction:column;gap:12px;padding-bottom:22px;border-bottom:3px solid var(--fg)}
.lead .hl{font-size:clamp(1.6rem,4vw,2.6rem)}
.lead .art-box{aspect-ratio:16/8}
.lead .dek{font-size:1.12rem}

/* duo */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.duo .story{display:flex;flex-direction:column;gap:9px}
.duo .art-box{aspect-ratio:16/10}
.duo .hl{font-size:1.25rem}
.duo .dek{font-size:.98rem}

/* rows */
.rows{display:flex;flex-direction:column}
.rowstory{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:16px;padding-block:16px;border-bottom:1px solid var(--line)}
.rowstory:first-child{padding-top:0}
.rowstory .art-box{aspect-ratio:16/10}
.rowstory .txt{display:flex;flex-direction:column;gap:7px;min-width:0}
.rowstory .hl{font-size:1.1rem}
.rowstory .dek{font-size:.95rem;color:var(--muted)}
.story.open{grid-column:1/-1}
.rowstory.open{grid-template-columns:1fr}
.rowstory.open .hl,.duo .open .hl{font-size:clamp(1.6rem,4vw,2.3rem)}
.rowstory.open .art-box{aspect-ratio:16/7}

/* rail */
.rail{position:static;display:flex;flex-direction:column;gap:20px;min-width:0}
.box{border-top:5px solid var(--hot);background:var(--soft)}
.box h3{margin:0;font-family:var(--display);font-weight:900;font-stretch:72%;text-transform:uppercase;font-size:1.3rem;letter-spacing:.01em;padding:10px 14px 4px}
.box ol{list-style:none;margin:0;padding:0 14px 8px;counter-reset:n}
.box li{counter-increment:n;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.box li:last-child{border-bottom:0}
.box li::before{content:counter(n);font-family:var(--display);font-weight:900;font-stretch:70%;font-size:1.7rem;line-height:1;color:var(--hot)}
.box li button{all:unset;cursor:pointer;font-family:var(--ui);font-weight:800;font-stretch:90%;font-size:.95rem;line-height:1.25;color:var(--fg)}
.box li button:hover{color:var(--link)}
.box li button:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.box li .d{display:block;font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-top:3px;font-weight:400}
.secbox{border-top-color:var(--navy);padding-bottom:10px}
.secbox .chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px 4px}
.secbox .chips button{--c:var(--navy);font-family:var(--ui);font-weight:800;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;background:var(--surface);color:var(--c);border:2px solid var(--c);padding:4px 9px;cursor:pointer}
.secbox .chips button span{font-family:var(--mono);font-weight:500;margin-left:6px}

.tgbox{border-top-color:#229ed9;padding-bottom:12px}
/* world counters: styled like a CGM receiver readout */
.statbox{border-top-color:var(--t1);padding-bottom:12px}
.statbox .lead-in{font-family:var(--ui);font-size:.8rem;color:var(--muted);padding:0 14px 8px;margin:0}
.dial{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;padding:4px 14px 6px}
.dial svg{width:120px;height:120px;display:block}
.dial .ring-bg{fill:none;stroke:var(--line);stroke-width:12}
.dial .ring-t1{fill:none;stroke:var(--t1);stroke-width:12}
.dial .ring-t2{fill:none;stroke:var(--t2);stroke-width:12}
.dial .ctr{font-family:var(--mono);font-size:11px;fill:var(--muted)}

  }

    b.append(el("span","kxl-i",String(i+1).padStart(2,"0")),el("span","kxl-t",pick(it.title)),meta,el("span","kxl-a","↘"));

function ticker(){
  const t=$("ticker"),tr=$("ticker-track");tr.replaceChildren();
  const top=items.slice(0,6);if(!top.length){t.hidden=true;return}
  t.hidden=false;
  for(let pass=0;pass<2;pass++)for(const it of top){const b=el("button",null,pick(it.title));b.type="button";if(pass)b.tabIndex=-1,b.setAttribute("aria-hidden","true");b.onclick=()=>{cat="all";toggle(it,!!pick(it.body))};tr.append(b)}
}

function render(){
  renderChrome();const u=UI[lang];const feed=$("feed");feed.replaceChildren();gid=0;
  if(state!=="ready"||!items.length){
    $("ticker").hidden=true;
    const box=el("div","state");
    if(state==="loading")box.append(el("strong",null,u.loading));
    else if(state==="off")box.append(el("strong",null,u.off),el("span",null,u.offText));
    else box.append(el("strong",null,u.empty),el("span",null,u.emptyText));
    feed.append(box);$("t-count").textContent="";$("t-upd").textContent="";return}
  ticker();
  const list=items.filter(i=>cat==="all"||i.cat===cat);
  $("t-count").textContent=u.count(list.length);
  const latest=items.reduce((m,i)=>i.added&&i.added>m?i.added:m,"");
  $("t-upd").textContent=latest?`${u.upd}: ${fmtDate(latest.slice(0,10))}`:"";
  const layout=el("div","layout");const main=el("div","maincol");
  if(posts.length){const t=tgBox("mob");if(t)main.append(t)}
  if(list[0])main.append(story(list[0],"lead"));
  const pair=list.slice(1,3);
  if(pair.length===2){const d=el("div","duo");pair.forEach(it=>d.append(story(it,"duo")));main.append(d)}
  const restStart=pair.length===2?3:1;
  const rows=el("div","rows");list.slice(restStart).forEach(it=>rows.append(story(it,"row")));
  if(rows.childElementCount)main.append(rows);
  layout.append(main,rail(list));feed.append(layout);
}
